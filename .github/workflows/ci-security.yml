name: ci-security

# Static security checks for this repo: committed secrets (gitleaks), workflow
# syntax/expression errors (actionlint) and workflow supply-chain smells
# (zizmor). Same three jobs, tool versions and flags as vault-explorer.
#
# The three jobs are deliberately independent (no `needs:`): a gitleaks hit
# must not hide an actionlint error, and one red check should still tell you
# about the other two on the same run.
#
# No Renovate in this repo (it would need a PAT the repo does not have): the
# tool versions below and every action SHA are bumped by hand. The
# `# renovate:` annotations stay, identical to vault-explorer, so the pins are
# greppable across repos and a future Renovate setup picks them up as is.

on:
  pull_request:
  push:
    branches:
      - main

# Read-only. Nothing here writes to the repo, publishes a package or mints an
# OIDC token; the scanners only need the tree.
permissions:
  contents: read

# Safe to cancel: these are read-only scanners, so an aborted run leaves
# nothing half-applied.
#
# The group key MUST keep `github.ref`. A concurrency group holds at most one
# pending run and evicts the older queued one, so a ref-less key would put
# every open pull request in a single group and let them delete each other's
# checks. With the ref in the key only a superseded push to the same pull
# request is cancelled.
#
# Cancel only for pull_request: on main every push shares `refs/heads/main`,
# so cancelling there would leave the earlier commits never scanned.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history. A secret that was committed and then deleted in a
          # later commit is still in the pack and still leaked; the default
          # depth-1 clone only ever sees the tip and reports clean.
          fetch-depth: 0
          # No step in this job pushes, so stripping the token costs nothing
          # and keeps it out of the worktree the scanner then walks.
          persist-credentials: false

      # Pinned release binary rather than gitleaks/gitleaks-action: the action
      # gates on a GITLEAKS_LICENSE for organisation-owned repos and nags for
      # one otherwise. The binary has no licence path at all and pins to an
      # exact version, which is also what the actions do with SHAs.
      - name: Install gitleaks
        env:
          # renovate: datasource=github-releases depName=gitleaks/gitleaks
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Scan git history for secrets
        # `git`, not `detect` or `dir`: `detect` is the deprecated 8.18 alias
        # and `dir` scans the worktree only — neither reads the history that
        # `fetch-depth: 0` above paid for.
        #
        # --redact: findings land in a run log; print the rule and the location,
        # never the matched secret. A scan that leaks the secret into the log it
        # is warning you about has made the problem worse.
        #
        # --config .gitleaks.toml is explicit rather than relying on discovery,
        # so a rename of that file fails the job instead of silently falling
        # back to the default ruleset. Harmless while the file only extends the
        # defaults; not once it carries a scoped allowlist.
        #
        # No --exit-code needed: gitleaks already exits 1 on findings.
        run: gitleaks git --config .gitleaks.toml --redact --no-banner .

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        env:
          # renovate: datasource=github-releases depName=rhysd/actionlint
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" actionlint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # actionlint does not fail when shellcheck is absent — it just stops
      # checking `run:` blocks. Assert it loudly instead, because that is most
      # of the value here: without shellcheck no `run:` block in either
      # workflow is linted, the curl | tar install steps included.
      - name: Assert shellcheck is present
        run: shellcheck --version

      - name: Lint workflows
        # No path argument: actionlint discovers .github/workflows/** itself
        # when run from the repo root, so a workflow added with the `.yaml`
        # extension is covered without editing this job.
        run: actionlint -color

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned release binary rather than zizmorcore/zizmor-action: the action
      # is built around uploading SARIF to GitHub code scanning, which needs
      # `security-events: write` and Advanced Security — not available on a
      # user-owned private repo on Pro. The binary just fails the job instead.
      - name: Install zizmor
        env:
          # renovate: datasource=github-releases depName=zizmorcore/zizmor
          ZIZMOR_VERSION: 1.29.0
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" zizmor
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Audit workflows
        env:
          # Enables the online audits (known-vulnerable-actions, stale-action-refs)
          # — the ones that catch a pinned SHA that has since been advisoried.
          # Read-only scope; the workflow-level `contents: read` covers it.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Default threshold (medium) from the first run: there is no backlog of
        # known findings to hold back, so no `--min-severity` and no separate
        # non-gating report step.
        run: zizmor .github/workflows/
